{
  "apiVersion": "v1",
  "kind": "ConfigMap",
  "metadata": {
    "name": "lodeen-dashboard",
    "namespace": "monitoring",
    "labels": {
      "grafana_dashboard": "1"
    }
  },
  "data": {
    "lodeen.json": "{\n  \"annotations\": {\n    \"list\": []\n  },\n  \"editable\": true,\n  \"graphTooltip\": 1,\n  \"refresh\": \"10s\",\n  \"schemaVersion\": 39,\n  \"tags\": [\n    \"lodeen\"\n  ],\n  \"time\": {\n    \"from\": \"now-15m\",\n    \"to\": \"now\"\n  },\n  \"timezone\": \"browser\",\n  \"title\": \"LODEEN \\u2014 World Server\",\n  \"uid\": \"lodeen-world\",\n  \"version\": 1,\n  \"panels\": [\n    {\n      \"id\": 1,\n      \"type\": \"timeseries\",\n      \"title\": \"Tick rate (target 20 Hz)\",\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 0\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${DS_PROMETHEUS}\"\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"ops\",\n          \"min\": 0\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum(rate(lodeen_server_ticks_total[1m]))\",\n          \"legendFormat\": \"ticks/s\"\n        }\n      ]\n    },\n    {\n      \"id\": 2,\n      \"type\": \"timeseries\",\n      \"title\": \"Tick duration p50 / p95 / p99\",\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 0\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${DS_PROMETHEUS}\"\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"s\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"expr\": \"histogram_quantile(0.50, sum by (le) (rate(lodeen_tick_duration_seconds_bucket[5m])))\",\n          \"legendFormat\": \"p50\"\n        },\n        {\n          \"expr\": \"histogram_quantile(0.95, sum by (le) (rate(lodeen_tick_duration_seconds_bucket[5m])))\",\n          \"legendFormat\": \"p95\"\n        },\n        {\n          \"expr\": \"histogram_quantile(0.99, sum by (le) (rate(lodeen_tick_duration_seconds_bucket[5m])))\",\n          \"legendFormat\": \"p99\"\n        }\n      ]\n    },\n    {\n      \"id\": 3,\n      \"type\": \"timeseries\",\n      \"title\": \"Players connected\",\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 8\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${DS_PROMETHEUS}\"\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"min\": 0,\n          \"decimals\": 0\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum(lodeen_server_players_connected)\",\n          \"legendFormat\": \"players (total)\"\n        },\n        {\n          \"expr\": \"lodeen_server_players_connected\",\n          \"legendFormat\": \"{{pod}}\"\n        }\n      ],\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\",\n          \"showLegend\": true\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      }\n    },\n    {\n      \"id\": 4,\n      \"type\": \"timeseries\",\n      \"title\": \"Snapshot size p50 / p95\",\n      \"gridPos\": {\n        \"h\": 6,\n        \"w\": 9,\n        \"x\": 6,\n        \"y\": 8\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${DS_PROMETHEUS}\"\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"bytes\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"expr\": \"histogram_quantile(0.50, sum by (le) (rate(lodeen_snapshot_bytes_bucket[5m])))\",\n          \"legendFormat\": \"p50\"\n        },\n        {\n          \"expr\": \"histogram_quantile(0.95, sum by (le) (rate(lodeen_snapshot_bytes_bucket[5m])))\",\n          \"legendFormat\": \"p95\"\n        }\n      ]\n    },\n    {\n      \"id\": 5,\n      \"type\": \"timeseries\",\n      \"title\": \"Client RTT p50 / p95 / p99\",\n      \"gridPos\": {\n        \"h\": 6,\n        \"w\": 9,\n        \"x\": 15,\n        \"y\": 8\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${DS_PROMETHEUS}\"\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"s\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"expr\": \"histogram_quantile(0.50, sum by (le) (rate(lodeen_rtt_seconds_bucket[5m])))\",\n          \"legendFormat\": \"p50\"\n        },\n        {\n          \"expr\": \"histogram_quantile(0.95, sum by (le) (rate(lodeen_rtt_seconds_bucket[5m])))\",\n          \"legendFormat\": \"p95\"\n        },\n        {\n          \"expr\": \"histogram_quantile(0.99, sum by (le) (rate(lodeen_rtt_seconds_bucket[5m])))\",\n          \"legendFormat\": \"p99\"\n        }\n      ]\n    }\n  ],\n  \"__inputs\": [\n    {\n      \"name\": \"DS_PROMETHEUS\",\n      \"label\": \"Prometheus\",\n      \"type\": \"datasource\",\n      \"pluginId\": \"prometheus\",\n      \"pluginName\": \"Prometheus\"\n    }\n  ],\n  \"__requires\": [\n    {\n      \"type\": \"grafana\",\n      \"id\": \"grafana\",\n      \"name\": \"Grafana\",\n      \"version\": \"10.0.0\"\n    }\n  ]\n}"
  }
}