plugins {
    id 'application'
}

dependencies {
    implementation project(':shared')

    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")
    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-glfw"
    implementation "org.lwjgl:lwjgl-opengl"

    implementation "org.joml:joml:$jomlVersion"
    implementation "com.fasterxml.jackson.core:jackson-databind:$jacksonVersion"
    implementation "de.javagl:jgltf-model:$jgltfVersion"
    implementation "io.github.spair:imgui-java-app:$imguiVersion"

    def os = System.getProperty('os.name').toLowerCase()
    def natives = os.contains('win') ? 'natives-windows'
                : os.contains('mac') ? 'natives-macos' : 'natives-linux'
    ['lwjgl','lwjgl-glfw','lwjgl-opengl'].each {
        runtimeOnly "org.lwjgl:$it::$natives"
    }
    runtimeOnly "io.github.spair:imgui-java-natives-linux:$imguiVersion"
}

application {
    mainClass = 'com.lodeen.Main'
}
