---
- name: Download k3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: "0755"

- name: Install k3s (server, disable traefik — we'll install our own ingress)
  ansible.builtin.shell: |
    INSTALL_K3S_EXEC="server --disable traefik --write-kubeconfig-mode 644" \
    /tmp/k3s-install.sh
  args:
    creates: /usr/local/bin/k3s

- name: Wait for k3s to be ready
  ansible.builtin.command: k3s kubectl get nodes
  register: k3s_nodes
  until: "'Ready' in k3s_nodes.stdout"
  retries: 30
  delay: 5
  changed_when: false

- name: Ensure k3s is enabled at boot
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started

- name: Install helm
  ansible.builtin.shell: |
    curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  args:
    creates: /usr/local/bin/helm

- name: Create kubeconfig for root user
  ansible.builtin.file:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /root/.kube/config
    state: link
    force: true
  ignore_errors: true
