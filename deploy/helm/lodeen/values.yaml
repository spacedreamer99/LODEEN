# Default values for lodeen.
# Override with -f values-dev.yaml / values-prod.yaml or --set.

replicaCount: 1

image:
  repository: ghcr.io/spacedreamer99/lodeen-server
  tag: main
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# The world process is stateful: each world must have exactly one replica.
# Scaling is horizontal *across worlds*, not within one world.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  gamePort: 7777
  adminPort: 9091

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: admin
  initialDelaySeconds: 5
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: admin
  initialDelaySeconds: 3
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

# Env vars for the server
env:
  LODEEN_ENV: "prod"
  LODEEN_LOG_LEVEL: "info"
  LODEEN_SERVER_TCP_ADDR: ":7777"
  LODEEN_SERVER_ADMIN_ADDR: ":9091"
  LODEEN_SERVER_TICK_RATE: "20"

# Prometheus ServiceMonitor
serviceMonitor:
  enabled: true
  interval: 15s
  scrapeTimeout: 10s
  # Must match the kube-prometheus-stack release label
  releaseLabel: kps

# PodDisruptionBudget — protects the single stateful replica
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# NetworkPolicy — opt-in for hardened envs
networkPolicy:
  enabled: false
  # Allow ingress from anywhere on game port, admin only from monitoring
  gamePortFromAnywhere: true
  adminPortFromNamespaces:
    - monitoring

nodeSelector: {}
tolerations: []
affinity: {}
