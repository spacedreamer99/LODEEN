
plugins { id 'java'; id 'application' }
group = 'com.lodeen'; version = '0.1.0'
repositories {
    maven { url 'https://maven.aliyun.com/repository/public' }
    maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
    mavenCentral()
}
ext { lwjglVersion = '3.3.3'; jomlVersion = '1.10.5' }

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")
    implementation "org.lwjgl:lwjgl", "org.lwjgl:lwjgl-glfw", "org.lwjgl:lwjgl-opengl"
    implementation "org.joml:joml:$jomlVersion"
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'de.javagl:jgltf-model:2.0.4'
    implementation 'org.slf4j:slf4j-api:2.0.13'
    implementation 'ch.qos.logback:logback-classic:1.5.6'
    implementation 'ch.qos.logback:logback-core:1.5.6'
    implementation 'io.github.spair:imgui-java-app:1.86.11'
    runtimeOnly 'io.github.spair:imgui-java-natives-linux:1.86.11'

    def os = System.getProperty('os.name').toLowerCase()
    def natives = os.contains('win') ? 'natives-windows'
                : os.contains('mac') ? 'natives-macos' : 'natives-linux'
    ['lwjgl','lwjgl-glfw','lwjgl-opengl'].each {
        runtimeOnly "org.lwjgl:$it::$natives"
    }
}
application { mainClass = 'com.lodeen.Main' }
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
